name: Verify Backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zenix_ci_test
          POSTGRES_USER: zenix_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenix_ci -d zenix_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (moderate and higher)
        run: npm audit --omit=dev --audit-level=moderate
      # Read-only diagnostics on the one-off ops branch. Never apply npm audit fix
      # to production or let an external production probe gate unrelated CI.
      - name: Investigate deployed dependency advisories
        if: github.ref_name == 'ops/production-readiness-probes-20261112'
        shell: bash
        run: |
          npm audit --omit=dev --json > "${RUNNER_TEMP}/zenix-dependency-audit.json" || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          let report={};
          try{report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/zenix-dependency-audit.json','utf8'));}
          catch{console.log('DEPENDENCY_AUDIT_UNAVAILABLE: invalid JSON');process.exit(0)}
          const list=Object.entries(report.vulnerabilities||{}).map(([name,entry])=>({
            name,severity:entry.severity,range:entry.range,fixAvailable:entry.fixAvailable,
            via:(entry.via||[]).map(v=>typeof v==='string'?v:({name:v.name,source:v.source,title:v.title,range:v.range,severity:v.severity}))
          }));
          console.log('DEPENDENCY_AUDIT_RESULT '+JSON.stringify({
            metadata:report.metadata?.vulnerabilities||null,error:report.error?{code:report.error.code,summary:report.error.summary}:null,advisories:list
          }));
          NODE
      - name: Prepare minimal advisory fix in temporary CI workspace (no commit)
        if: github.ref_name == 'ops/production-readiness-probes-20261112'
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund > "${RUNNER_TEMP}/audit-fix-output.txt" 2>&1 || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const before=JSON.parse(execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8'}));
          const after=JSON.parse(readFileSync('package-lock.json','utf8'));
          const keys=[...new Set([...Object.keys(before.packages||{}),...Object.keys(after.packages||{})])].sort();
          const changed=keys.filter(k=>JSON.stringify(before.packages[k])!==JSON.stringify(after.packages[k])).map(k=>({path:k,old:before.packages[k]||null,next:after.packages[k]||null}));
          console.log('DEPENDENCY_LOCK_PROPOSAL '+JSON.stringify({changed,changes:changed.length}));
          NODE
          npm audit --omit=dev --json > "${RUNNER_TEMP}/zenix-audit-after-fix.json" || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          try {
            const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/zenix-audit-after-fix.json','utf8'));
            console.log('DEPENDENCY_AFTER_FIX '+JSON.stringify({vulnerabilities:report.metadata?.vulnerabilities,error:report.error?.code||null}));
          }catch {console.log('DEPENDENCY_AFTER_FIX_UNAVAILABLE')}
          NODE
          # Restore the committed lock before normal test gates.
          git checkout -- package-lock.json
      - name: Public health observation (GET only, informational)
        if: github.ref_name == 'ops/production-readiness-probes-20261112'
        run: node scripts/probeProductionHealth.mjs || true
      - run: npm run check
      - run: npm test
      - run: |
          npm run test:db
          node --test --test-concurrency=1 tests/inventoryLookupPerformance.test.mjs tests/bootstrapInventoryAggregation.test.mjs tests/posCatalogDatabase.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
      - run: npm run test:http
        env:
          TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          FRONTEND_ORIGIN: http://localhost:5173
      - name: POS refunds, replay, stock, credit and tenant isolation
        run: node --test --test-concurrency=1 tests/posProHttp.test.mjs tests/posProFinalQa.test.mjs tests/warehouseMigrationAudit.test.mjs tests/posHttpIntegration.test.mjs tests/financialWritesHttp.test.mjs tests/transferReceiptHttp.test.mjs tests/branchTransferCostingHttp.test.mjs tests/transferLockTimeoutDatabase.test.mjs tests/sellerRefundAttributionDatabase.test.mjs tests/financeReport.test.mjs tests/prompt3Performance.test.mjs tests/saasDatabaseIntegration.test.mjs tests/saleTrackingSelections.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
      - name: Trial modes and OTP (disposable PG, test-only SMS)
        run: node --test --test-concurrency=1 tests/temporaryTrialIntegration.test.mjs tests/trialOtpIntegration.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
      - run: npm run db:audit-subscriptions
        env:
          DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
      - name: Three-tier billing, resource limits and AI (serialized disposable PG)
        run: node --test --test-concurrency=1 tests/subscriptionDatabase.test.mjs tests/subscriptionHttp.test.mjs tests/resourceLimitsDatabase.test.mjs tests/resourceCapacityPerformance.test.mjs tests/resourceLimitsHttp.test.mjs tests/aiDatabase.test.mjs tests/aiAgentActionsDatabase.test.mjs tests/aiAgentConversationDatabase.test.mjs tests/aiAgentHttp.test.mjs tests/aiReadReports.test.mjs tests/aiRestockReport.test.mjs tests/releaseIntegration.test.mjs
        env:
          DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          SUBSCRIPTION_TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          RESOURCE_TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          AI_TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          AI_AGENT_TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          RELEASE_TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
      - name: Checkout correctness and broad latency regression budget
        run: node scripts/benchmark-checkout.mjs
        env:
          DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_test
          CHECKOUT_P95_BUDGET_MS: '1500'
          ZENIX_PERFORMANCE_METRICS: 'true'
      - name: Legacy history and financial replay state survive upgrades (separate empty PG database)
        shell: bash
        run: |
          set -euo pipefail
          service_container='${{ job.services.postgres.id }}'
          docker exec "$service_container" createdb -U zenix_ci zenix_ci_subscription_migration_test
          node --test tests/subscriptionMigration.test.mjs
          RELEASE_RECOVERY_TEST_DATABASE_URL='postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_subscription_migration_test' node --test tests/releaseRecoveryDatabase.test.mjs
          docker exec "$service_container" pg_dump -U zenix_ci -d zenix_ci_subscription_migration_test -Fc -f /tmp/zenix-subscription-backup.dump
          docker exec "$service_container" createdb -U zenix_ci zenix_ci_subscription_restore_test
          docker exec "$service_container" pg_restore --exit-on-error -U zenix_ci -d zenix_ci_subscription_restore_test /tmp/zenix-subscription-backup.dump
          RECOVERY_SOURCE_DATABASE_URL='postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_subscription_migration_test' RECOVERY_TARGET_DATABASE_URL='postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_subscription_restore_test' node scripts/verifyRestoreDrill.mjs
        env:
          SUBSCRIPTION_MIGRATION_TEST_DATABASE_URL: postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_subscription_migration_test
      - name: Backup and restore (disposable PostgreSQL service only)
        shell: bash
        run: |
          set -euo pipefail
          service_container='${{ job.services.postgres.id }}'
          # All commands execute in the isolated CI Postgres 16 service.
          docker exec "$service_container" pg_dump -U zenix_ci -d zenix_ci_test -Fc -f /tmp/zenix-ci-backup.dump
          docker exec "$service_container" createdb -U zenix_ci zenix_ci_restore_test
          docker exec "$service_container" pg_restore --exit-on-error -U zenix_ci -d zenix_ci_restore_test /tmp/zenix-ci-backup.dump
          DATABASE_URL='postgresql://zenix_ci:ci_only_password@127.0.0.1:5432/zenix_ci_restore_test' npm run db:verify
