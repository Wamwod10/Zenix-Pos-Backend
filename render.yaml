services:
  - type: web
    name: zenix-pos-api
    env: node
    rootDir: backend
    buildCommand: npm install
    preDeployCommand: npm run migrate && npm run db:verify
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: 5
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: zenixposbot
      - key: ZENIX_PAYMENT_BOT_TOKEN
        sync: false
      - key: ZENIX_PAYMENT_ADMIN_CHAT_ID
        sync: false
      - key: ZENIX_PAYMENT_ADMIN_USER_IDS
        sync: false
      - key: ZENIX_PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: ZENIX_PAYMENT_BOT_USERNAME
        value: zenixpaymentbot
      - key: PUBLIC_API_URL
        sync: false
